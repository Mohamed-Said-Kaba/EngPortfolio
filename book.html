<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio imprimable · Mohamed Said Kaba</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3864;--blue:#2f5597;--gold:#b8913f;--muted:#5d6779;--line:#e2e7ef;--panel:#f3f5f9}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;color:#1a2233;background:#e9edf3}
.page{width:210mm;height:297mm;overflow:hidden;margin:16px auto;background:#fff;padding:15mm 15mm 18mm;box-shadow:0 6px 24px rgba(0,0,0,.1);position:relative;display:flex;flex-direction:column}
h1{font-size:34pt;margin:0;color:var(--navy);letter-spacing:-.02em;line-height:1.05}h1 b{color:var(--gold)}
h2{font-size:19pt;color:var(--navy);margin:0 0 6px;border-left:5px solid var(--navy);padding-left:10px;line-height:1.2}
.meta{font-size:9pt;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
p{margin:6px 0;color:var(--muted);font-size:10.5pt;line-height:1.5}
ul{margin:8px 0 0;padding-left:18px;font-size:10pt;line-height:1.55}
li{margin-bottom:3px}
.tags{margin-top:7px}
.tags span{display:inline-block;font-size:8pt;font-weight:600;color:var(--navy);background:#e8eef8;padding:2px 7px;border-radius:4px;margin:4px 4px 0 0}

/* --- Visuels : jamais recadrés, toujours entiers --- */
figure{margin:0;display:flex;flex-direction:column;min-height:0}
figure .frame{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;padding:3mm;overflow:hidden}
figure img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
figcaption{font-size:8pt;color:var(--muted);margin-top:2mm;line-height:1.3}

.hero{flex:1;min-height:0;margin-top:7mm;display:flex;flex-direction:column}
.gal{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:7mm;margin-top:7mm}
.gal.one{grid-template-columns:1fr;grid-auto-rows:1fr}
.contd{font-size:9pt;color:var(--blue);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:0 0 2mm}

.cover{justify-content:center}
.cover img.p{width:46mm;height:46mm;border-radius:50%;object-fit:cover;border:4px solid var(--navy);margin-bottom:10mm}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;margin-top:12mm}
.kpis div{background:var(--panel);border-radius:6px;padding:5mm}
.kpis b{display:block;font-size:20pt;color:var(--navy)}.kpis span{font-size:8.5pt;color:var(--muted);line-height:1.3;display:block}
.foot{position:absolute;bottom:8mm;left:15mm;right:15mm;font-size:8pt;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:3mm}
.bar{position:sticky;top:0;z-index:9;background:var(--navy);color:#fff;padding:10px 16px;text-align:center;font-size:14px}
.bar button{margin-left:12px;font:600 14px Inter;padding:6px 14px;border:0;border-radius:6px;cursor:pointer}
@media print{body{background:#fff}.page{margin:0;box-shadow:none;page-break-after:always}.bar{display:none}@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="bar">Version imprimable du portfolio. <button onclick="window.print()">Imprimer / Enregistrer en PDF</button></div>
<div id="book"></div>
<script src="content/site.js"></script><script src="content/profile.js"></script><script src="content/works.js"></script>
<script>
(function(){
  var S=SITE.site,P=SITE.profile,W=SITE.works.items,L='fr';
  function t(v){return v==null?'':typeof v==='string'?v:(v[L]||v.fr||'')}
  function l(v){return !v?[]:Array.isArray(v)?v:(v[L]||v.fr||[])}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fig(im){return '<figure><div class="frame"><img src="'+im.src+'" alt=""></div><figcaption>'+esc(t(im.caption))+'</figcaption></figure>'}
  var foot='<div class="foot"><span>'+esc(S.firstName+' '+S.lastName)+' · '+esc(S.contact.email)+' · '+esc(S.contact.phone)+'</span><span>mohamed-said-kaba.github.io/EngPortfolio</span></div>';

  var h='<section class="page cover"><img class="p" src="'+S.photo+'" alt=""><h1>'+esc(S.firstName)+' <b>'+esc(S.lastName)+'</b></h1>'
      +'<p style="font-size:14pt;color:#2f5597;font-weight:700;margin-top:8px">'+esc(t(S.title))+'</p>'
      +'<p style="font-size:12pt">'+esc(t(S.tagline))+'</p>'
      +'<div class="kpis">'+P.kpis.map(function(k){return '<div><b>'+esc(k.value)+'</b><span>'+esc(t(k.label))+'</span></div>'}).join('')+'</div>'
      +'<p style="margin-top:14mm">Portfolio de réalisations : outils d\'ingénierie, projets et stages.</p>'+foot+'</section>';

  W.forEach(function(w){
    var imgs=w.images||[], head='<div class="meta">'+esc([t(w.org),t(w.period)].filter(Boolean).join(' · '))+'</div><h2>'+esc(t(w.title))+'</h2>';
    // Page 1 : le texte, puis une seule image de couverture en grand
    h+='<section class="page">'+head
      +'<p>'+esc(t(w.summary))+'</p>'
      +'<ul>'+l(w.points).map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>'
      +'<div class="tags">'+(w.tags||[]).map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>'
      +(imgs.length?'<div class="hero">'+fig(imgs[0])+'</div>':'')
      +foot+'</section>';
    // Pages suivantes : les autres visuels, 4 par page, jamais rognés
    var rest=imgs.slice(1);
    for(var i=0;i<rest.length;i+=4){
      var chunk=rest.slice(i,i+4);
      h+='<section class="page">'+head
        +'<p class="contd">Suite des visuels</p>'
        +'<div class="gal'+(chunk.length===1?' one':'')+'">'+chunk.map(fig).join('')+'</div>'
        +foot+'</section>';
    }
  });
  document.getElementById('book').innerHTML=h;
})();
</script>
</body>
</html>
