<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio imprimable · Mohamed Said Kaba</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3864;--blue:#2f5597;--gold:#b8913f;--muted:#5d6779;--line:#e2e7ef;--panel:#f3f5f9}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:#1a2233;background:#e9edf3}
.page{width:210mm;height:297mm;overflow:hidden;margin:16px auto;background:#fff;padding:16mm 15mm;box-shadow:0 6px 24px rgba(0,0,0,.1);position:relative}
h1{font-size:34pt;margin:0;color:var(--navy);letter-spacing:-.02em;line-height:1.05}h1 b{color:var(--gold)}
h2{font-size:20pt;color:var(--navy);margin:0 0 4px;border-left:5px solid var(--navy);padding-left:10px}
.meta{font-size:9pt;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
p{margin:6px 0;color:var(--muted);font-size:10.5pt;line-height:1.5}
ul{margin:8px 0 0;padding-left:18px;font-size:10pt;line-height:1.5}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:8mm}
.imgs figure{margin:0}.imgs img{width:100%;height:52mm;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.imgs figure:first-child{grid-column:1/-1}.imgs figure:first-child img{height:80mm}
figcaption{font-size:8pt;color:var(--muted);margin-top:2px}
.tags span{display:inline-block;font-size:8pt;font-weight:600;color:var(--navy);background:#e8eef8;padding:2px 7px;border-radius:4px;margin:6px 4px 0 0}
.cover{display:flex;flex-direction:column;justify-content:center}
.cover img.p{width:46mm;height:46mm;border-radius:50%;object-fit:cover;border:4px solid var(--navy);margin-bottom:10mm}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;margin-top:12mm}.kpis div{background:var(--panel);border-radius:6px;padding:5mm}.kpis b{display:block;font-size:20pt;color:var(--navy)}.kpis span{font-size:8.5pt;color:var(--muted)}
.foot{position:absolute;bottom:9mm;left:15mm;right:15mm;font-size:8pt;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:3mm}
.bar{position:sticky;top:0;background:var(--navy);color:#fff;padding:10px 16px;text-align:center;font-size:14px}.bar button{margin-left:12px;font:600 14px Inter;padding:6px 14px;border:0;border-radius:6px;cursor:pointer}
@media print{body{background:#fff}.page{margin:0;box-shadow:none;page-break-after:always}.bar{display:none}@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="bar">Version imprimable du portfolio. <button onclick="window.print()">Imprimer / Enregistrer en PDF</button></div>
<div id="book"></div>
<script src="content/site.js"></script><script src="content/profile.js"></script><script src="content/works.js"></script>
<script>
(function(){
  var S=SITE.site,P=SITE.profile,W=SITE.works.items,L='fr';
  function t(v){return v==null?'':typeof v==='string'?v:(v[L]||v.fr||'')}
  function l(v){return !v?[]:Array.isArray(v)?v:(v[L]||v.fr||[])}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var foot='<div class="foot"><span>'+esc(S.firstName+' '+S.lastName)+' · '+esc(S.contact.email)+' · '+esc(S.contact.phone)+'</span><span>mohamed-said-kaba.github.io/EngPortfolio</span></div>';
  var h='<section class="page cover"><img class="p" src="'+S.photo+'" alt=""><h1>'+esc(S.firstName)+' <b>'+esc(S.lastName)+'</b></h1><p style="font-size:14pt;color:#2f5597;font-weight:700;margin-top:8px">'+esc(t(S.title))+'</p><p style="font-size:12pt">'+esc(t(S.tagline))+'</p><div class="kpis">'+P.kpis.map(function(k){return '<div><b>'+esc(k.value)+'</b><span>'+esc(t(k.label))+'</span></div>'}).join('')+'</div><p style="margin-top:14mm">Portfolio de réalisations : outils d\'ingénierie, projets et stages.</p>'+foot+'</section>';
  W.filter(function(w){return w.images&&w.images.length}).forEach(function(w){
    h+='<section class="page"><div class="meta">'+esc([t(w.org),t(w.period)].filter(Boolean).join(' · '))+'</div><h2>'+esc(t(w.title))+'</h2><p>'+esc(t(w.summary))+'</p><ul>'+l(w.points).map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul><div class="tags">'+(w.tags||[]).map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div><div class="imgs">'+w.images.slice(0,5).map(function(im){return '<figure><img src="'+im.src+'" alt=""><figcaption>'+esc(t(im.caption))+'</figcaption></figure>'}).join('')+'</div>'+foot+'</section>';
  });
  document.getElementById('book').innerHTML=h;
})();
</script>
</body>
</html>
